name: CI/CD Pipeline - FastAPI

on:
  push:
  pull_request:
    branches: [ "develop", "main" ]

# Variáveis globais para evitar repetição (conforme dica do laboratório)
env:
  IMAGE_NAME: fastapi-app

jobs:
  test:
    name: Testes e Qualidade de Código
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes automatizados
        run: |
          # Executa pytest se houver testes configurados
          pytest || echo "Nenhum teste encontrado ou pytest não configurado."

  deploy_homologacao:
    name: Deploy - Homologação
    needs: test
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Deploy Automático via SSH (Homologação)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST_HOMOL || secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Iniciando deploy em Homologação..."
            cd /home/${{ secrets.EC2_USERNAME }}/app || mkdir -p /home/${{ secrets.EC2_USERNAME }}/app && cd /home/${{ secrets.EC2_USERNAME }}/app
            git pull origin develop
            docker build -t ${{ env.IMAGE_NAME }}:homol .
            docker stop fastapi-homol || true
            docker rm fastapi-homol || true
            docker run -d --name fastapi-homol -p 8080:80 --restart always ${{ env.IMAGE_NAME }}:homol
            echo "Deploy em Homologação concluído na porta 8080!"

  deploy_producao:
    name: Deploy - Produção
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Configuração do GitHub Environment para exigir aprovação manual
    environment: 
      name: production
      url: http://seu-ip-producao
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Deploy Controlado via SSH (Produção)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Iniciando deploy em Produção com aprovação prévia..."
            cd /home/${{ secrets.EC2_USERNAME }}/app-prod || mkdir -p /home/${{ secrets.EC2_USERNAME }}/app-prod && cd /home/${{ secrets.EC2_USERNAME }}/app-prod
            git pull origin main
            docker build -t ${{ env.IMAGE_NAME }}:prod .
            docker stop fastapi-prod || true
            docker rm fastapi-prod || true
            docker run -d --name fastapi-prod -p 80:80 --restart always ${{ env.IMAGE_NAME }}:prod
            echo "Deploy em Produção realizado com sucesso!"
